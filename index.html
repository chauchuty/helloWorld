<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Pixel Art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      image-rendering: pixelated;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Press Start 2P', monospace;
      background: #1a1a2e;
      color: #fff;
    }
    /* Céu pixelado com estrelas */
    .stars {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(#fff 1px, transparent 1px),
        radial-gradient(#fff 1px, transparent 1px);
      background-size: 60px 60px, 90px 90px;
      background-position: 10px 20px, 40px 60px;
      opacity: 0.4;
      pointer-events: none;
    }
    .login-box {
      position: relative;
      background: #16213e;
      border: 4px solid #fff;
      box-shadow:
        0 0 0 4px #16213e,
        0 0 0 8px #e94560;
      padding: 40px 32px;
      width: min(90vw, 420px);
      text-align: center;
    }
    .login-box h1 {
      font-size: 24px;
      color: #ffd700;
      text-shadow: 3px 3px 0 #e94560;
      margin: 0 0 8px;
      line-height: 1.4;
    }
    .login-box p {
      font-size: 8px;
      color: #8ecae6;
      margin: 0 0 32px;
    }
    label {
      display: block;
      text-align: left;
      font-size: 9px;
      color: #ffd700;
      margin: 0 0 6px 14px;
    }
    input {
      width: 100%;
      padding: 14px;
      margin: 0 0 24px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: #fff;
      background: #0f3460;
      border: 3px solid #8ecae6;
      outline: none;
      border-radius: 0;
    }
    input::placeholder {
      color: #4f77aa;
    }
    input:focus {
      border-color: #ffd700;
    }
    button {
      width: 100%;
      padding: 16px;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: #1a1a2e;
      background: #ffd700;
      border: none;
      box-shadow: 0 4px 0 #b8860b;
      cursor: pointer;
      transition: transform 0.05s;
      border-radius: 0;
    }
    button:hover {
      background: #ffe55c;
    }
    button:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #b8860b;
    }
    .coin {
      font-size: 28px;
      margin-bottom: 16px;
      display: inline-block;
      animation: jump 1s steps(2) infinite;
    }
    @keyframes jump {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="login-box">
    <span class="coin">🪙</span>
    <h1>LOGIN</h1>
    <p>Pressione START para continuar</p>
    <form>
      <label for="email">E-MAIL</label>
      <input type="email" id="email" name="email" placeholder="SEU@EMAIL.COM" required>

      <label for="senha">SENHA</label>
      <input type="password" id="senha" name="senha" placeholder="••••••••" required>

      <button type="submit">► ENTRAR</button>
    </form>
  </div>
</body>
</html>
