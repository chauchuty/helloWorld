<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Super Mario World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      image-rendering: pixelated;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Press Start 2P', monospace;
      /* Céu do Super Mario World */
      background: linear-gradient(#5c94fc, #7db9ff 70%, #8fd3ff);
      overflow-x: hidden;
    }

    /* ===== Cenário (nuvens e morros pixelados) ===== */
    .cloud {
      position: fixed;
      background: #fff;
      box-shadow: none;
      border: 3px solid #1a1acc;
      z-index: 0;
      pointer-events: none;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: #fff;
      border: 3px solid #1a1acc;
    }
    .cloud::before {
      width: 30px; height: 30px;
      top: -30px; left: 10px;
      border-bottom: none;
    }
    .cloud::after {
      width: 30px; height: 30px;
      top: -30px; left: 40px;
      border-bottom: none;
      border-left: none;
    }
    .cloud-1 { top: 12%; left: 6%; width: 70px; height: 25px; animation: drift 30s linear infinite; }
    .cloud-2 { top: 28%; right: 8%; width: 70px; height: 25px; animation: drift 40s linear infinite reverse; }
    .cloud-3 { bottom: 30%; left: 10%; width: 70px; height: 25px; opacity: .8; }

    @keyframes drift {
      from { transform: translateX(-15vw); }
      to   { transform: translateX(115vw); }
    }

    .hill {
      position: fixed;
      bottom: 0;
      width: 130px; height: 65px;
      background: #00a800;
      border-radius: 65px 65px 0 0;
      z-index: 1;
      pointer-events: none;
    }
    .hill-1 { left: -30px; }
    .hill-2 { right: -40px; width: 170px; height: 85px; }
    /* "Chão" de tijolos */
    .ground {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 34px;
      background:
        repeating-linear-gradient(0deg, #c84c0c 0 16px, #e45c10 16px 32px),
        linear-gradient(#e45c10, #e45c10);
      border-top: 4px solid #000;
      z-index: 2;
      pointer-events: none;
    }

    /* ===== Card estilo caixa "?" ===== */
    .login-box {
      position: relative;
      z-index: 3;
      background: #d8a038;
      border: 4px solid #000;
      box-shadow:
        inset 4px 4px 0 #fcd8a8,
        inset -4px -4px 0 #a05008;
      padding: 40px 32px;
      width: min(92vw, 420px);
      text-align: center;
      margin-bottom: 108px;
    }
    /* Rebites/dourados nos cantos estilo bloco */
    .login-box::before {
      content: '';
      position: absolute;
      inset: 6px;
      pointer-events: none;
      background:
        radial-gradient(circle 3px at 4px 4px, #fff 2px, transparent 2px),
        radial-gradient(circle 3px at calc(100% - 4px) 4px, #fff 2px, transparent 2px),
        radial-gradient(circle 3px at 4px calc(100% - 4px), #fff 2px, transparent 2px),
        radial-gradient(circle 3px at calc(100% - 4px) calc(100% - 4px), #fff 2px, transparent 2px);
    }

    .login-box h1 {
      font-size: 22px;
      color: #fff;
      text-shadow:
        3px 3px 0 #a05008,
        5px 5px 0 #000;
      margin: 0 0 10px;
      letter-spacing: 2px;
    }
    .login-box p {
      font-size: 8px;
      color: #7a3c04;
      margin: 0 0 28px;
    }

    label {
      display: block;
      text-align: left;
      font-size: 9px;
      color: #fff;
      text-shadow: 2px 2px 0 #a05008;
      margin: 0 0 6px 14px;
    }
    input {
      width: 100%;
      padding: 14px;
      margin: 0 0 22px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: #000;
      background: #f8f8f8;
      border: 3px solid #000;
      box-shadow: inset 3px 3px 0 #b0b0b0;
      outline: none;
      border-radius: 0;
    }
    input::placeholder { color: #9a9a9a; }
    input:focus { background: #fff; border-color: #e52521; }

    button {
      width: 100%;
      padding: 16px;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: #fff;
      background: #43b047;
      border: 4px solid #000;
      box-shadow:
        inset 4px 4px 0 #8ee48e,
        inset -4px -4px 0 #1f7a22,
        0 5px 0 #000;
      cursor: pointer;
      transition: transform 0.05s;
      border-radius: 0;
      text-shadow: 2px 2px 0 #1f7a22;
    }
    button:hover { background: #55cc58; }
    button:active {
      transform: translateY(5px);
      box-shadow:
        inset 4px 4px 0 #8ee48e,
        inset -4px -4px 0 #1f7a22,
        0 0 0 #000;
    }

    /* Mario pulando no topo do card */
    .mario {
      position: absolute;
      top: -60px;
      left: 50%;
      margin-left: -24px;
      font-size: 40px;
      animation: mario-jump 1.2s steps(2) infinite;
    }
    @keyframes mario-jump {
      0%, 100% { transform: translateY(0) scaleX(1); }
      50%      { transform: translateY(-24px) scale(0.95); }
    }
  </style>
</head>
<body>
  <!-- Cenário -->
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  <div class="hill hill-1"></div>
  <div class="hill hill-2"></div>
  <div class="ground"></div>

  <!-- Formulário -->
  <div class="login-box">
    <span class="mario">🍄</span>
    <h1>SUPER LOGIN</h1>
    <p>World 1-1 — Entre na fase!</p>
    <form>
      <label for="email">E-MAIL</label>
      <input type="email" id="email" name="email" placeholder="SEU@EMAIL.COM" required>

      <label for="senha">SENHA</label>
      <input type="password" id="senha" name="senha" placeholder="••••••••" required>

      <button type="submit">► START!</button>
    </form>
  </div>
</body>
</html>
